<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>التميز في الكمي — أ/ علاء ناجي</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap">
<style>
:root{--bg:#f6f3ea;--bg2:#ece6d6;--card:#fffdf8;--tx:#13231f;--mut:#5f6f69;--bd:#e3dccb;--pri:#0b5d4b;--pri2:#127a62;--gold:#c8962c;--gold2:#e8b84a;--ok:#16a34a;--bad:#dc2626;--soft:#eef5f1;--sh:0 10px 30px -12px rgba(11,93,75,.25)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1411;--bg2:#0f1c18;--card:#13221d;--tx:#e9f2ee;--mut:#9db3aa;--bd:#22372f;--pri:#3fbf98;--pri2:#2aa481;--soft:#183029;--sh:0 10px 30px -12px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1411;--bg2:#0f1c18;--card:#13221d;--tx:#e9f2ee;--mut:#9db3aa;--bd:#22372f;--pri:#3fbf98;--pri2:#2aa481;--soft:#183029;--sh:0 10px 30px -12px rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--tx);font-family:Tajawal,Tahoma,sans-serif;line-height:1.7;direction:rtl;background:var(--bg);background-image:radial-gradient(circle at 100% 0,rgba(200,150,44,.12),transparent 40%),radial-gradient(circle at 0 100%,rgba(11,93,75,.12),transparent 45%);padding-bottom:env(safe-area-inset-bottom,0)}
.wrap{max-width:900px;margin:0 auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* ---------- الترويسة ---------- */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:22px 22px 26px;color:#fff;background:linear-gradient(135deg,#06352b 0%,#0b5d4b 55%,#127a62 100%);box-shadow:var(--sh)}
.hero:before{content:"";position:absolute;inset:auto -60px -80px auto;width:240px;height:240px;border-radius:50%;border:28px solid rgba(232,184,74,.18)}
.hero:after{content:"∑ √ π ÷ %";position:absolute;left:18px;top:10px;font-size:2.2rem;letter-spacing:12px;color:rgba(255,255,255,.07);font-weight:900}
.brand{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.logo{flex:none;width:58px;height:58px;border-radius:18px;background:linear-gradient(145deg,var(--gold2),var(--gold));display:grid;place-items:center;color:#06352b;font-weight:900;font-size:1.9rem;box-shadow:0 6px 16px rgba(0,0,0,.25);transform:rotate(-6deg)}
.brand h1{margin:0;font-size:1.55rem;font-weight:900;line-height:1.2}
.brand p{margin:2px 0 0;color:#d6efe6;font-weight:500}
.brand p b{color:var(--gold2)}
.tagline{position:relative;z-index:1;display:inline-block;margin-top:14px;padding:4px 14px;border-radius:8px;background:rgba(255,255,255,.1);border-inline-start:4px solid var(--gold2);font-weight:700;font-size:.92rem}
/* ---------- البطاقات ---------- */
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:20px;margin-top:16px;box-shadow:var(--sh)}
h2{margin:0 0 8px;font-size:1.25rem;font-weight:800}p{margin:.4em 0}.mut{color:var(--mut)}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.feat div{background:var(--soft);border-radius:16px;padding:12px;display:flex;gap:10px;align-items:center;font-weight:700;font-size:.95rem}
.feat i{font-style:normal;flex:none;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--pri);color:#fff;font-size:1.1rem}
input[type=text],textarea{width:100%;font:inherit;padding:13px 16px;border-radius:14px;border:2px solid var(--bd);background:var(--bg);color:var(--tx)}
textarea{min-height:120px;direction:ltr;font-size:.85rem}
input:focus,textarea:focus{outline:none;border-color:var(--gold)}
.btn{font:inherit;font-weight:800;border:0;border-radius:14px;padding:12px 22px;cursor:pointer;color:#fff;background:var(--pri);box-shadow:0 4px 0 #06352b;transition:transform .1s;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #06352b}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#2b1d00;box-shadow:0 4px 0 #8a6518}
.btn.ghost{background:transparent;color:var(--pri);border:2px solid var(--bd);box-shadow:none}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.warn{background:#fff4d6;color:#7a4b00;border-radius:14px;padding:12px 14px;margin-top:12px;font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
/* ---------- شريط الاختبار ---------- */
.status{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ring{flex:none;width:64px;height:64px;position:relative}.ring svg{width:64px;height:64px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:.95rem;font-weight:900}
.st-meta{flex:1;min-width:150px}.st-meta .nm{font-weight:800}.st-meta .sm{color:var(--mut);font-size:.88rem}
.timer{background:var(--soft);color:var(--pri);border-radius:12px;padding:6px 14px;font-weight:900;font-variant-numeric:tabular-nums}
.track{display:flex;gap:3px;margin-top:14px}.track span{flex:1;height:7px;border-radius:4px;background:var(--bd)}.track span.a{background:var(--pri2)}.track span.c{background:var(--gold)}
/* ---------- السؤال ---------- */
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.qbadge{background:var(--tx);color:var(--card);border-radius:10px;padding:2px 12px;font-weight:900;font-size:.9rem}
.qhead .of{color:var(--mut);font-weight:700;font-size:.9rem}
.qt{font-size:1.18rem;font-weight:700;line-height:2;margin:6px 0 10px}.qt sup{font-size:.65em}
.qt img.inl,.qt img.inl9{background:#fff;border-radius:10px;vertical-align:middle;padding:3px 8px;height:auto;max-height:90px;max-width:100%}
.eq{background:#fff;color:#111;border-radius:10px;padding:2px 10px;font-size:1.25em}
.fig{background:#fff;color:#111;border:2px dashed var(--bd);border-radius:18px;padding:10px;margin:10px auto;max-width:560px;text-align:center}.fig .ft{font-weight:800;color:#0b5d4b;font-size:.88rem}.fig svg{width:100%;height:auto;max-height:340px}
table.cmp{border-collapse:separate;border-spacing:0;border-radius:16px;overflow:hidden;margin:10px 0;background:#fff;color:#111;max-width:100%;box-shadow:0 0 0 2px #0b5d4b}
table.cmp th{background:#0b5d4b;color:#fff;padding:7px 16px;font-weight:800}table.cmp td{padding:10px 16px;text-align:center;font-weight:700}
table.cmp th+th,table.cmp td+td{border-right:2px solid #0b5d4b}table.cmp td img{height:48px;width:auto}table.cmp.small td{font-size:1rem}
.fr{display:inline-flex;flex-direction:column;align-items:center;line-height:1.2;vertical-align:middle;margin:0 3px}.fr .n{border-bottom:2px solid currentColor;padding:0 6px}.fr .d{padding:0 6px}
.arc{position:relative;display:inline-block}.arc:before{content:'⌒';position:absolute;top:-.6em;left:0;right:0;text-align:center;line-height:1}
.ov{border-top:2px solid currentColor;padding:0 2px}.m{unicode-bidi:isolate;white-space:nowrap}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.opt{display:flex;align-items:center;gap:14px;text-align:right;font:inherit;font-weight:700;font-size:1.1rem;padding:10px 12px;border-radius:16px;cursor:pointer;color:var(--tx);background:var(--bg);border:2px solid var(--bd);min-height:58px;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--gold)}
.opt .l{flex:none;width:40px;height:40px;border-radius:12px;background:var(--card);border:2px solid var(--bd);display:grid;place-items:center;font-weight:900;color:var(--pri)}
.opt .ck{margin-inline-start:auto;width:26px;height:26px;border-radius:50%;border:2px solid var(--bd);flex:none}
.opt.on{background:var(--soft);border-color:var(--pri)}.opt.on .l{background:var(--pri);border-color:var(--pri);color:#fff}
.opt.on .ck{background:var(--pri);border-color:var(--pri);box-shadow:inset 0 0 0 5px var(--card)}
.opt sup{font-size:.65em}
/* ---------- خريطة الأسئلة ---------- */
details.map{margin-top:16px;border-top:1px dashed var(--bd);padding-top:12px}
details.map summary{cursor:pointer;font-weight:800;color:var(--pri)}
.dots{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin-top:10px}
.dot{height:40px;border-radius:12px;border:2px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-weight:800;cursor:pointer}
.dot.a{background:var(--pri2);color:#fff;border-color:var(--pri2)}.dot.c{border-color:var(--gold);box-shadow:0 0 0 3px rgba(200,150,44,.35)}
/* ---------- النتيجة ---------- */
.res{display:flex;gap:20px;align-items:center;flex-wrap:wrap;justify-content:center;text-align:center}
.gauge{width:170px;height:170px;position:relative}.gauge svg{width:170px;height:170px;transform:rotate(-90deg)}
.gauge div{position:absolute;inset:0;display:grid;place-content:center}.gauge b{font-size:2.3rem;font-weight:900;line-height:1}.gauge span{color:var(--mut);font-weight:700}
.medal{display:inline-block;padding:4px 16px;border-radius:999px;color:#fff;font-weight:800}
.pill{display:inline-block;background:var(--soft);border-radius:999px;padding:3px 14px;font-weight:700;margin:3px}
.rv{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}.rv span{height:42px;border-radius:12px;display:grid;place-items:center;font-weight:800;color:#fff;font-size:.9rem}
.g{background:var(--ok)}.r{background:var(--bad)}.n0{background:#94a3b8}
/* ---------- لوحة المعلم ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.kpi{background:var(--soft);border-radius:16px;padding:12px;text-align:center}.kpi b{display:block;font-size:1.55rem;color:var(--pri);font-weight:900}.kpi span{color:var(--mut);font-size:.85rem}
.hb{display:flex;align-items:center;gap:8px;margin:6px 0}.hb .lb{width:110px;font-size:.85rem}.hb .tr{flex:1;height:20px;background:var(--soft);border-radius:8px;overflow:hidden}.hb .tr i{display:block;height:100%;border-radius:8px}.hb .v{width:46px;font-size:.85rem;font-weight:800}
.tw{overflow-x:auto}table.t{border-collapse:collapse;width:100%;font-size:.88rem}table.t th,table.t td{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:center;white-space:nowrap}table.t th{background:var(--soft);color:var(--pri)}
.tag{border-radius:999px;padding:1px 10px;color:#fff;font-size:.78rem;font-weight:800}
.foot{text-align:center;color:var(--mut);font-size:.82rem;margin:22px 0 8px;font-weight:700}.foot b{color:var(--gold)}
@media(max-width:520px){.brand h1{font-size:1.3rem}.logo{width:50px;height:50px;font-size:1.6rem}.card{padding:16px}.qt{font-size:1.08rem}}
