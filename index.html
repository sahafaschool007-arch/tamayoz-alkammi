<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>التميز في الكمي — أ/ علاء ناجي</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap">
<style>
:root{--bg:#f6f3ea;--bg2:#ece6d6;--card:#fffdf8;--tx:#13231f;--mut:#5f6f69;--bd:#e3dccb;--pri:#0b5d4b;--pri2:#127a62;--gold:#c8962c;--gold2:#e8b84a;--ok:#16a34a;--bad:#dc2626;--soft:#eef5f1;--sh:0 10px 30px -12px rgba(11,93,75,.25)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1411;--bg2:#0f1c18;--card:#13221d;--tx:#e9f2ee;--mut:#9db3aa;--bd:#22372f;--pri:#3fbf98;--pri2:#2aa481;--soft:#183029;--sh:0 10px 30px -12px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1411;--bg2:#0f1c18;--card:#13221d;--tx:#e9f2ee;--mut:#9db3aa;--bd:#22372f;--pri:#3fbf98;--pri2:#2aa481;--soft:#183029;--sh:0 10px 30px -12px rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--tx);font-family:Tajawal,Tahoma,sans-serif;line-height:1.7;direction:rtl;background:var(--bg);background-image:radial-gradient(circle at 100% 0,rgba(200,150,44,.12),transparent 40%),radial-gradient(circle at 0 100%,rgba(11,93,75,.12),transparent 45%);padding-bottom:env(safe-area-inset-bottom,0)}
.wrap{max-width:900px;margin:0 auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* ---------- الترويسة ---------- */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:22px 22px 26px;color:#fff;background:linear-gradient(135deg,#06352b 0%,#0b5d4b 55%,#127a62 100%);box-shadow:var(--sh)}
.hero:before{content:"";position:absolute;inset:auto -60px -80px auto;width:240px;height:240px;border-radius:50%;border:28px solid rgba(232,184,74,.18)}
.hero:after{content:"∑ √ π ÷ %";position:absolute;left:18px;top:10px;font-size:2.2rem;letter-spacing:12px;color:rgba(255,255,255,.07);font-weight:900}
.brand{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.logo{flex:none;width:92px;height:92px;border-radius:22px;background:#fff;display:grid;place-items:center;padding:6px;box-shadow:0 6px 16px rgba(0,0,0,.25);border:3px solid var(--gold2)}.logo img{width:100%;height:100%;object-fit:contain}
.brand h1{margin:0;font-size:1.55rem;font-weight:900;line-height:1.2}
.brand p{margin:2px 0 0;color:#d6efe6;font-weight:500}
.brand p b{color:var(--gold2)}
.tagline{position:relative;z-index:1;display:inline-block;margin-top:14px;padding:4px 14px;border-radius:8px;background:rgba(255,255,255,.1);border-inline-start:4px solid var(--gold2);font-weight:700;font-size:.92rem}
/* ---------- البطاقات ---------- */
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:20px;margin-top:16px;box-shadow:var(--sh)}
h2{margin:0 0 8px;font-size:1.25rem;font-weight:800}p{margin:.4em 0}.mut{color:var(--mut)}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.feat div{background:var(--soft);border-radius:16px;padding:12px;display:flex;gap:10px;align-items:center;font-weight:700;font-size:.95rem}
.feat i{font-style:normal;flex:none;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--pri);color:#fff;font-size:1.1rem}
input[type=text],input[type=tel],textarea{width:100%;font:inherit;padding:13px 16px;border-radius:14px;border:2px solid var(--bd);background:var(--bg);color:var(--tx)}
textarea{min-height:120px;direction:ltr;font-size:.85rem}
input:focus,textarea:focus{outline:none;border-color:var(--gold)}input[type=tel]{text-align:left;letter-spacing:1px}
.btn{font:inherit;font-weight:800;border:0;border-radius:14px;padding:12px 22px;cursor:pointer;color:#fff;background:var(--pri);box-shadow:0 4px 0 #06352b;transition:transform .1s;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #06352b}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#2b1d00;box-shadow:0 4px 0 #8a6518}
.btn.ghost{background:transparent;color:var(--pri);border:2px solid var(--bd);box-shadow:none}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.lbl{display:block;font-weight:800;margin:12px 0 6px}.req{color:var(--bad)}.hint{color:var(--mut);font-size:.88rem;margin:6px 0 0}
input.bad{border-color:var(--bad)}input.good{border-color:var(--ok)}
.warn{background:#fff4d6;color:#7a4b00;border-radius:14px;padding:12px 14px;margin-top:12px;font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
/* ---------- شريط الاختبار ---------- */
.status{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ring{flex:none;width:64px;height:64px;position:relative}.ring svg{width:64px;height:64px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:.95rem;font-weight:900}
.st-meta{flex:1;min-width:150px}.st-meta .nm{font-weight:800}.st-meta .sm{color:var(--mut);font-size:.88rem}
.timer{background:var(--soft);color:var(--pri);border-radius:12px;padding:6px 14px;font-weight:900;font-variant-numeric:tabular-nums}
.track{display:flex;gap:3px;margin-top:14px}.track span{flex:1;height:7px;border-radius:4px;background:var(--bd)}.track span.a{background:var(--pri2)}.track span.c{background:var(--gold)}
/* ---------- السؤال ---------- */
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.qbadge{background:var(--tx);color:var(--card);border-radius:10px;padding:2px 12px;font-weight:900;font-size:.9rem}
.qhead .of{color:var(--mut);font-weight:700;font-size:.9rem}
.qt{font-size:1.18rem;font-weight:700;line-height:2;margin:6px 0 10px}.qt sup{font-size:.65em}
.qt img.inl,.qt img.inl9{background:#fff;border-radius:10px;vertical-align:middle;padding:3px 8px;height:auto;max-height:90px;max-width:100%}
.eq{background:#fff;color:#111;border-radius:10px;padding:2px 10px;font-size:1.25em}
.fig{background:#fff;color:#111;border:2px dashed var(--bd);border-radius:18px;padding:10px;margin:10px auto;max-width:560px;text-align:center}.fig .ft{font-weight:800;color:#0b5d4b;font-size:.88rem}.fig svg{width:100%;height:auto;max-height:340px}
table.cmp{border-collapse:separate;border-spacing:0;border-radius:16px;overflow:hidden;margin:10px 0;background:#fff;color:#111;max-width:100%;box-shadow:0 0 0 2px #0b5d4b}
table.cmp th{background:#0b5d4b;color:#fff;padding:7px 16px;font-weight:800}table.cmp td{padding:10px 16px;text-align:center;font-weight:700}
table.cmp th+th,table.cmp td+td{border-right:2px solid #0b5d4b}table.cmp td img{height:48px;width:auto}table.cmp.small td{font-size:1rem}
.fr{display:inline-flex;flex-direction:column;align-items:center;line-height:1.2;vertical-align:middle;margin:0 3px}.fr .n{border-bottom:2px solid currentColor;padding:0 6px}.fr .d{padding:0 6px}
.arc{position:relative;display:inline-block}.arc:before{content:'⌒';position:absolute;top:-.6em;left:0;right:0;text-align:center;line-height:1}
.ov{border-top:2px solid currentColor;padding:0 2px}.m{unicode-bidi:isolate;white-space:nowrap}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.opt{display:flex;align-items:center;gap:14px;text-align:right;font:inherit;font-weight:700;font-size:1.1rem;padding:10px 12px;border-radius:16px;cursor:pointer;color:var(--tx);background:var(--bg);border:2px solid var(--bd);min-height:58px;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--gold)}input[type=tel]{text-align:left;letter-spacing:1px}
.opt .l{flex:none;width:40px;height:40px;border-radius:12px;background:var(--card);border:2px solid var(--bd);display:grid;place-items:center;font-weight:900;color:var(--pri)}
.opt .ck{margin-inline-start:auto;width:26px;height:26px;border-radius:50%;border:2px solid var(--bd);flex:none}
.opt.on{background:var(--soft);border-color:var(--pri)}.opt.on .l{background:var(--pri);border-color:var(--pri);color:#fff}
.opt.on .ck{background:var(--pri);border-color:var(--pri);box-shadow:inset 0 0 0 5px var(--card)}
.opt sup{font-size:.65em}
/* ---------- خريطة الأسئلة ---------- */
details.map{margin-top:16px;border-top:1px dashed var(--bd);padding-top:12px}
details.map summary{cursor:pointer;font-weight:800;color:var(--pri)}
.dots{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin-top:10px}
.dot{height:40px;border-radius:12px;border:2px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-weight:800;cursor:pointer}
.dot.a{background:var(--pri2);color:#fff;border-color:var(--pri2)}.dot.c{border-color:var(--gold);box-shadow:0 0 0 3px rgba(200,150,44,.35)}
/* ---------- النتيجة ---------- */
.res{display:flex;gap:20px;align-items:center;flex-wrap:wrap;justify-content:center;text-align:center}
.gauge{width:170px;height:170px;position:relative}.gauge svg{width:170px;height:170px;transform:rotate(-90deg)}
.gauge div{position:absolute;inset:0;display:grid;place-content:center}.gauge b{font-size:2.3rem;font-weight:900;line-height:1}.gauge span{color:var(--mut);font-weight:700}
.medal{display:inline-block;padding:4px 16px;border-radius:999px;color:#fff;font-weight:800}
.pill{display:inline-block;background:var(--soft);border-radius:999px;padding:3px 14px;font-weight:700;margin:3px}
.rv{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}.rv span{height:42px;border-radius:12px;display:grid;place-items:center;font-weight:800;color:#fff;font-size:.9rem}
.g{background:var(--ok)}.r{background:var(--bad)}.n0{background:#94a3b8}
/* ---------- لوحة المعلم ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.kpi{background:var(--soft);border-radius:16px;padding:12px;text-align:center}.kpi b{display:block;font-size:1.55rem;color:var(--pri);font-weight:900}.kpi span{color:var(--mut);font-size:.85rem}
.hb{display:flex;align-items:center;gap:8px;margin:6px 0}.hb .lb{width:110px;font-size:.85rem}.hb .tr{flex:1;height:20px;background:var(--soft);border-radius:8px;overflow:hidden}.hb .tr i{display:block;height:100%;border-radius:8px}.hb .v{width:46px;font-size:.85rem;font-weight:800}
.tw{overflow-x:auto}table.t{border-collapse:collapse;width:100%;font-size:.88rem}table.t th,table.t td{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:center;white-space:nowrap}table.t th{background:var(--soft);color:var(--pri)}
.tag{border-radius:999px;padding:1px 10px;color:#fff;font-size:.78rem;font-weight:800}
.foot{text-align:center;color:var(--mut);font-size:.82rem;margin:22px 0 8px;font-weight:700}.foot b{color:var(--gold)}
@media(max-width:520px){.brand h1{font-size:1.3rem}.logo{width:74px;height:74px}.card{padding:16px}.qt{font-size:1.08rem}}

  if(v.length<2){er.textContent="فضلًا اكتب اسمك الثلاثي أولًا";er.hidden=false;$("#nm").focus();return}
  if(!ph){er.textContent="رقم الجوال مطلوب بالصيغة 9665XXXXXXXX (١٢ رقمًا تبدأ بـ ٩٦٦٥)";er.hidden=false;$("#ph").classList.add("bad");$("#ph").focus();return}
  st=fresh();st.name=v;st.ph=ph;st.t0=Date.now();save();exam()};
 $("#ph").oninput=e=>{const el=e.target,c=el.value.replace(/[٠-٩]/g,d=>AD.indexOf(d)).replace(/\D/g,"");if(c!==el.value)el.value=c;el.classList.toggle("bad",c.length>=12&&!normPh(c));el.classList.toggle("good",!!normPh(c))};
 $("#nm").onkeydown=$("#ph").onkeydown=e=>{if(e.key==="Enter")$("#go").click()};

}
function teacherGate(){
 const ov=document.createElement("div");
 ov.setAttribute("style","position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px");
 ov.innerHTML='<div dir="rtl" style="background:#fffdf5;border-radius:18px;padding:22px;width:100%;max-width:340px;box-shadow:0 10px 40px rgba(0,0,0,.25);font-family:inherit;text-align:center">'+
 '<div style="font-weight:800;font-size:18px;color:#0b5d47;margin-bottom:6px">لوحة المعلم</div>'+
 '<div style="font-size:14px;color:#555;margin-bottom:14px">أدخل كلمة المرور للدخول</div>'+
 '<input id="tpw" type="password" inputmode="numeric" autocomplete="off" style="width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccc;border-radius:12px;font-size:18px;text-align:center;font-family:inherit">'+
 '<div id="tpe" style="color:#c0392b;font-size:13px;min-height:20px;margin-top:8px"></div>'+
 '<div style="display:flex;gap:10px;margin-top:6px"><button id="tpo" style="flex:1;padding:11px;border:0;border-radius:12px;background:#0b5d47;color:#fff;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit">دخول</button>'+
 '<button id="tpc" style="flex:1;padding:11px;border:1px solid #ccc;border-radius:12px;background:#fff;color:#333;font-size:15px;cursor:pointer;font-family:inherit">إلغاء</button></div></div>';
 document.body.appendChild(ov);
 const inp=ov.querySelector("#tpw"),err=ov.querySelector("#tpe");
 const close=()=>ov.remove();
 const ok=()=>{if(inp.value.trim()==="007"){close();teacher();}else{err.textContent="كلمة المرور غير صحيحة";inp.value="";inp.focus();}};
 ov.querySelector("#tpo").onclick=ok;

 ov.onclick=e=>{if(e.target===ov)close()};
 inp.onkeydown=e=>{if(e.key==="Enter")ok();else if(e.key==="Escape")close()};
 setTimeout(()=>inp.focus(),50);
}
function exam(conf){
 const P=st.ord.length,qi=st.ord[st.cur],q=QS[qi],done=st.ord.filter(j=>st.ans[j]!=="-").length,un=P-done,C=2*Math.PI*26;
 shell(`<section class="card"><div class="status">
  <div class="ring"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="none" stroke="var(--bd)" stroke-width="7"/><circle cx="32" cy="32" r="26" fill="none" stroke="var(--pri2)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-done/P)}"/></svg><b>${ar(done)}/${ar(P)}</b></div>
  <div class="st-meta"><div class="nm">${esc(st.name)}</div><div class="sm">أجبت عن ${ar(done)} من ${ar(P)} سؤالًا</div></div>
  <div class="timer" id="tm">⏱ ${fmt(Math.round((Date.now()-st.t0)/1000))}</div></div>
  <div class="track">${st.ord.map((j,k)=>`<span class="${k===st.cur?"c":st.ans[j]!=="-"?"a":""}"></span>`).join("")}</div></section>
 <section class="card"><div class="qhead"><span class="qbadge">السؤال ${ar(st.cur+1)}</span><span class="of">من ${ar(P)}</span></div>${q.h}
 <div class="opts">${q.o.map((o,i)=>`<button class="opt${st.ans[qi]===L[i]?" on":""}" data-i="${i}"><span class="l">${AL[i]}</span><span>${o}</span><span class="ck"></span></button>`).join("")}</div>
 ${conf?`<div class="warn">لديك ${ar(un)} سؤال بلا إجابة. هل تريد الإنهاء؟ <button class="btn gold" id="fy" style="padding:6px 14px">نعم، أنهِ الاختبار</button></div>`:""}
 <div class="row"><button class="btn ghost" id="pv" ${st.cur?"":"disabled"}>→ السابق</button>${st.cur<P-1?'<button class="btn" id="nx">التالي ←</button>':'<button class="btn gold" id="fn">إنهاء الاختبار ✓</button>'}</div>
 <details class="map"${conf?" open":""}><summary>خريطة الأسئلة</summary><div class="dots">${st.ord.map((j,k)=>`<button class="dot${st.ans[j]!=="-"?" a":""}${k===st.cur?" c":""}" data-j="${k}">${ar(k+1)}</button>`).join("")}</div></details></section>`);
 tick=setInterval(()=>{const t=$("#tm");if(t)t.textContent="⏱ "+fmt(Math.round((Date.now()-st.t0)/1000))},1000);
 app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{st.ans[qi]=L[+b.dataset.i];save();exam()});
 app.querySelectorAll(".dot").forEach(b=>b.onclick=()=>{st.cur=+b.dataset.j;save();exam()});
 const pv=$("#pv"),nx=$("#nx"),fn=$("#fn"),fy=$("#fy");
 pv.onclick=()=>{st.cur--;save();exam()};if(nx)nx.onclick=()=>{st.cur++;save();exam()};
 if(fn)fn.onclick=()=>un?exam(true):finish();if(fy)fy.onclick=finish;
}
function finish(){
 const secs=Math.max(1,Math.round((Date.now()-st.t0)/1000));
 const inS=new Set(st.ord),code=["AN3",st.name.replace(/\|/g," "),st.ph,st.ans.map((a,i)=>inS.has(i)?a:"x").join(""),secs].join("|");
 ls.set("an3_done",code);ls.set("an3_ord",JSON.stringify(st.ord));ls.del("an3_prog");result(code,false);
}
function parse(line){const p=line.trim().split("|");if(p[0]!=="AN3"||p.length<5)return null;const a=p[3];if(a.length!==N||/[^a-dx-]/.test(a)||!shown(a))return null;return{name:p[1],ph:p[2],ans:a,t:+p[4]||0,line:line.trim()}}
function result(code,again){
 const r=parse(code);if(!r){ls.del("an3_done");return intro()}
 const MAX=shown(r.ans),s=score(r.ans),p=Math.round(s/MAX*100),C=2*Math.PI*70;
 let ord;try{ord=JSON.parse(ls.get("an3_ord")||"null")}catch(e){}if(!Array.isArray(ord)||ord.some(i=>r.ans[i]==="x"))ord=[...Array(N).keys()].filter(i=>r.ans[i]!=="x");
 const msg=encodeURIComponent("نتيجة اختبار التميز في الكمي\n"+r.name+" — "+s+"/"+MAX+"\nالجوال: "+r.ph+"\n"+code);
 shell(`<section class="card"><div class="res">
  <div class="gauge"><svg viewBox="0 0 170 170"><circle cx="85" cy="85" r="70" fill="none" stroke="var(--bd)" stroke-width="14"/><circle cx="85" cy="85" r="70" fill="none" stroke="${bcol(p)}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p/100)}"/></svg><div><b>${ar(p)}٪</b><span>${ar(s)} من ${ar(MAX)}</span></div></div>
  <div><h2>${esc(r.name)}</h2><div class="mut" dir="ltr">${esc(r.ph)}</div><span class="medal" style="background:${bcol(p)}">${band(p)}</span><div style="margin-top:8px"><span class="pill">⏱ الزمن ${fmt(r.t)}</span></div>
  ${again?'<p class="mut">لقد أنهيت هذا الاختبار سابقًا على هذا الجهاز.</p>':""}</div></div></section>
 <section class="card"><h2>مراجعة إجاباتك</h2><div class="rv">${ord.map((i,k)=>`<span class="${r.ans[i]===KEY[i]?"g":"r"}">${ar(k+1)}</span>`).join("")}</div>
 <p class="mut">الأخضر صحيح — الأحمر خطأ أو بلا إجابة. الأرقام بحسب ترتيب ظهور الأسئلة لك.</p></section>
 <section class="card"><h2>أرسل نتيجتك إلى معلمك</h2><p>انسخ الكود التالي وأرسله إلى أ/ علاء ناجي، أو اضغط زر واتساب.</p>
 <textarea id="cd" readonly>${esc(code)}</textarea>
 <div class="row"><button class="btn ghost" id="cp">نسخ الكود</button><a class="btn gold" target="_blank" rel="noopener" href="https://wa.me/${WA}?text=${msg}">إرسال عبر واتساب</a></div><p id="ok" class="mut"></p></section>`);
 $("#cp").onclick=async()=>{const t=$("#cd");t.select();try{await navigator.clipboard.writeText(code);$("#ok").textContent="تم النسخ ✓"}catch(e){try{document.execCommand("copy");$("#ok").textContent="تم النسخ ✓"}catch(_){$("#ok").textContent="حدد الكود يدويًا وانسخه"}}};
}
/* ---------- لوحة المعلم ---------- */
const mean=a=>a.reduce((x,y)=>x+y,0)/(a.length||1),sd=a=>{const m=mean(a);return Math.sqrt(mean(a.map(x=>(x-m)**2)))};
const med=a=>{const s=[...a].sort((x,y)=>x-y),k=s.length>>1;return s.length?(s.length%2?s[k]:(s[k-1]+s[k])/2):0};
function teacher(){
 const saved=ls.get("an3_codes")||"";
 shell(`<section class="card"><h2>لوحة المعلم — التحليل الإحصائي</h2><p class="mut">الصق أكواد الطلاب هنا (كود في كل سطر) ثم اضغط «تحليل». تُحفظ الأكواد على هذا الجهاز فقط. أرقام الأسئلة هنا بحسب ترتيبها في بنك الأسئلة (${ar(N)} سؤالًا، يُسحب منها ${ar(PICK)} لكل طالب).</p>
 <textarea id="cs" placeholder="AN3|اسم الطالب|9665XXXXXXXX|abcx...|120">${esc(saved)}</textarea>
 <div class="row"><button class="btn" id="an">تحليل النتائج</button><button class="btn ghost" id="ex">تصدير CSV</button><button class="btn ghost" id="bk">رجوع</button></div>
 <div id="mg" class="mut"></div></section><div id="out"></div>
 <section class="card"><div class="row" style="margin:0"><button class="btn ghost" id="rs">السماح بمحاولة جديدة على هذا الجهاز</button><button class="btn ghost" id="cl">مسح الأكواد المحفوظة</button></div></section>`);
 $("#bk").onclick=()=>{st=fresh();intro()};
 $("#rs").onclick=()=>{ls.del("an3_done");ls.del("an3_ord");ls.del("an3_prog");$("#mg").textContent="تم السماح بمحاولة جديدة."};
 $("#cl").onclick=()=>{ls.del("an3_codes");teacher()};
 let rows=[];
 const run=()=>{const lines=$("#cs").value.split("\n").map(x=>x.trim()).filter(Boolean);ls.set("an3_codes",lines.join("\n"));
  const seen=new Set();rows=[];let bad=0;lines.forEach(l=>{const r=parse(l);if(!r){bad++;return}if(seen.has(r.line))return;seen.add(r.line);r.s=score(r.ans);r.m=shown(r.ans);rows.push(r)});
  $("#mg").textContent=`عدد النتائج الصحيحة: ${ar(rows.length)}`+(bad?` — أسطر غير صالحة: ${ar(bad)}`:"");stats(rows)};
 $("#an").onclick=run;
 $("#ex").onclick=()=>{if(!rows.length)run();const csv="﻿"+["الاسم,الجوال,الدرجة,من,النسبة,التقدير,الزمن بالثواني,"+[...KEY].map((_,i)=>"س"+(i+1)).join(",")].concat(rows.map(r=>[JSON.stringify(r.name),r.ph,r.s,r.m,Math.round(r.s/r.m*100),band(r.s/r.m*100),r.t,[...r.ans].join(",")].join(","))).join("\n");
  try{const u=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"})),a=document.createElement("a");a.href=u;a.download="نتائج-التميز-في-الكمي.csv";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}catch(e){}$("#mg").innerHTML='إن لم يبدأ التنزيل، انسخ البيانات التالية والصقها في ملف CSV:<textarea id="csvt" readonly style="margin-top:8px">'+esc(csv)+'</textarea>'};
 if(saved)run();
}
function stats(rows){
 const o=$("#out");const n=rows.length;if(!n){o.innerHTML="";return}
 const pc=rows.map(r=>r.s/r.m*100),sc=rows.map(r=>r.s),MAX=PICK,m=mean(pc),sdv=sd(pc),pass=pc.filter(x=>x>=60).length;
 const bins=[["أقل من ٥٠٪",0,50,"#dc2626"],["٥٠–٥٩٪",50,60,"#ea580c"],["٦٠–٦٩٪",60,70,"#d97706"],["٧٠–٧٩٪",70,80,"#2563eb"],["٨٠–٨٩٪",80,90,"#0d9488"],["٩٠٪ فأكثر",90,101,"#16a34a"]];
 const ord=[...rows].sort((a,b)=>b.s/b.m-a.s/a.m),g=Math.max(1,Math.ceil(n*.27)),up=ord.slice(0,g),lo=ord.slice(-g);
 const items=SC.map(i=>{const rs=rows.filter(r=>r.ans[i]!=="x"),m=rs.length;if(!m)return null;const c=rs.filter(r=>r.ans[i]===KEY[i]).length,p=c/m,cnt={a:0,b:0,c:0,d:0,"-":0};rs.forEach(r=>cnt[r.ans[i]]++);
  const U=up.filter(r=>r.ans[i]!=="x"),W=lo.filter(r=>r.ans[i]!=="x"),D=n>=4&&U.length&&W.length?U.filter(r=>r.ans[i]===KEY[i]).length/U.length-W.filter(r=>r.ans[i]===KEY[i]).length/W.length:null;
  let dm=null,dv=0;"abcd".split("").forEach(k=>{if(k!==KEY[i]&&cnt[k]>dv){dv=cnt[k];dm=k}});return{i,p,D,cnt,dm,dv,m}}).filter(Boolean);
  const dif=p=>p>=.8?["سهل","#16a34a"]:p>=.4?["متوسط","#d97706"]:["صعب","#dc2626"];
 const dis=D=>D===null?["—","#94a3b8"]:D>=.3?["جيد","#16a34a"]:D>=.1?["مقبول","#d97706"]:["ضعيف","#dc2626"];
 o.innerHTML=`<section class="card"><h2>المؤشرات العامة</h2><div class="grid">
 <div class="kpi"><b>${ar(n)}</b><span>عدد الطلاب</span></div><div class="kpi"><b>${ar(m.toFixed(1))}٪</b><span>المتوسط</span></div><div class="kpi"><b>${ar(med(pc).toFixed(1))}٪</b><span>الوسيط</span></div>
 <div class="kpi"><b>${ar(sdv.toFixed(1))}</b><span>الانحراف المعياري</span></div><div class="kpi"><b>${ar(Math.max(...sc))}</b><span>أعلى درجة من ${ar(MAX)}</span></div><div class="kpi"><b>${ar(Math.min(...sc))}</b><span>أدنى درجة</span></div>
 <div class="kpi"><b>${ar(Math.round(pass/n*100))}٪</b><span>نسبة النجاح (٦٠٪+)</span></div><div class="kpi"><b>${fmt(Math.round(mean(rows.map(r=>r.t))))}</b><span>متوسط الزمن</span></div><div class="kpi"><b>${ar(items.length)}</b><span>أسئلة ظهرت للطلاب</span></div></div></section>
 <section class="card"><h2>توزيع التقديرات</h2>${bins.map(b=>{const c=pc.filter(x=>x>=b[1]&&x<b[2]).length;return `<div class="hb"><span class="lb">${b[0]}</span><span class="tr"><i style="width:${c/n*100}%;background:${b[3]}"></i></span><span class="v">${ar(c)}</span></div>`}).join("")}</section>
 <section class="card"><h2>تحليل الأسئلة</h2><p class="mut">نسبة الإجابة الصحيحة، ومعامل التمييز (الفرق بين أفضل ٢٧٪ وأضعف ٢٧٪ من الطلاب، يظهر عند ٤ طلاب فأكثر)، وأكثر خيار خاطئ جذبًا للطلاب.</p>
 <div class="tw"><table class="t"><tr><th>السؤال</th><th>الصحيحة</th><th>الصعوبة</th><th>التمييز</th><th>الإجابة الصحيحة</th><th>أكثر خطأ شيوعًا</th><th>بلا إجابة</th><th>ظهر لـ</th></tr>
 ${items.map(t=>{const d=dif(t.p),s=dis(t.D);return `<tr><td>${ar(t.i+1)}</td><td><b>${ar(Math.round(t.p*100))}٪</b></td><td><span class="tag" style="background:${d[1]}">${d[0]}</span></td><td><span class="tag" style="background:${s[1]}">${s[0]}${t.D===null?"":" "+ar(t.D.toFixed(2))}</span></td><td>${AL["abcd".indexOf(KEY[t.i])]}</td><td>${t.dm&&t.dv?AL["abcd".indexOf(t.dm)]+" ("+ar(t.dv)+")":"—"}</td><td>${ar(t.cnt["-"])}</td><td>${ar(t.m)}</td></tr>`}).join("")}</table></div></section>
 <section class="card"><h2>قائمة الطلاب</h2><div class="tw"><table class="t"><tr><th>#</th><th>الاسم</th><th>الجوال</th><th>الدرجة</th><th>النسبة</th><th>التقدير</th><th>الزمن</th></tr>
 ${ord.map((r,k)=>{const p=Math.round(r.s/r.m*100);return `<tr><td>${ar(k+1)}</td><td style="text-align:right">${esc(r.name)}</td><td dir="ltr">${esc(r.ph)}</td><td><b>${ar(r.s)}/${ar(r.m)}</b></td><td>${ar(p)}٪</td><td><span class="tag" style="background:${bcol(p)}">${band(p)}</span></td><td>${fmt(r.t)}</td></tr>`}).join("")}</table></div></section>`;
}
try{const pg=JSON.parse(ls.get("an3_prog")||"null");if(pg&&pg.ans&&pg.ans.length===N&&Array.isArray(pg.ord)&&pg.ord.length===PICK&&!ls.get("an3_done")){st=pg;exam()}else intro()}catch(e){intro()}
